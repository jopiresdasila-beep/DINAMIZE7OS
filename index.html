<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dinamize7OS</title>
<meta name="description" content="Dinamize7OS — operação white-label para agências e clientes.">
<style>
:root{--b:#0066ff;--bg:#f4f6f8;--ink:#101318;--mut:#667085;--line:#e6e9ef;--card:#fff}
*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.blue{background:var(--b);color:#fff}.soft{background:#eef4ff;color:#2049a2}.ghost{background:#fff;border:1px solid var(--line)}
input,select,textarea{width:100%;border:1px solid #d9dee7;border-radius:10px;padding:11px;background:#fff;outline:none}textarea{min-height:90px}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:12px;font-weight:750;color:#475467}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}.hero{background:#0b0d11;color:#fff;padding:50px;display:flex;flex-direction:column;justify-content:space-between}.hero h1{font-size:clamp(44px,7vw,82px);line-height:.95;letter-spacing:-.06em;margin:0;max-width:720px}.hero p{color:#aab2bf;max-width:560px;line-height:1.6}
.brand{font-size:21px;font-weight:850;display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--b);color:#fff}.authside{display:grid;place-items:center;padding:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.login{width:min(430px,100%);padding:30px}.login h2{font-size:30px;letter-spacing:-.04em;margin:0 0 5px}.mut{color:var(--mut)}.link{background:none;border:0;color:var(--b);font-weight:750;cursor:pointer;padding:8px 0}
.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#0c0e12;color:#fff;padding:20px 14px;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}.side .brand{padding:3px 8px 22px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#aeb6c2;text-align:left;padding:11px;border-radius:10px;font-weight:650;cursor:pointer}.nav button.on,.nav button:hover{background:#191d24;color:#fff}.spacer{flex:1}.user{border-top:1px solid #252a32;padding:14px 8px 0;color:#aeb6c2;font-size:12px}.user strong{display:block;color:#fff;margin-bottom:4px}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.content{padding:24px;max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:20px}.head h2{margin:0;font-size:29px;letter-spacing:-.04em}.head p{margin:5px 0 0;color:var(--mut)}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.stat b{display:block;font-size:34px;margin-top:8px;letter-spacing:-.05em}.stat span{font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:800}.tbl{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:12px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}th{background:#fafbfc;color:#7b8492;font-size:10px;text-transform:uppercase}.badge{display:inline-block;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800;background:#f2f4f7;color:#667085}.ok{background:#ecfdf3;color:#027a48}.wait{background:#fffaeb;color:#a15c00}.bad{background:#fef3f2;color:#b42318}
.items{display:grid;gap:12px}.item{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.item h3{margin:0 0 5px}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;color:var(--mut);padding:35px}.invitewrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}.invitecard{width:min(520px,100%);padding:30px}.invitecard h1{font-size:34px;line-height:1.05;letter-spacing:-.04em;margin:22px 0 8px}.invitecard .eyebrow{font-size:12px;font-weight:850;text-transform:uppercase;color:var(--b);letter-spacing:.06em}.copybox{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:12px}.copybox input{font-size:12px;background:#f8fafc}.modalbg{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:20}.modal{background:#fff;border-radius:18px;width:min(600px,100%);max-height:90vh;overflow:auto}.mh,.mf{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.mf{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}.mb{padding:20px}.notice{padding:11px;border-radius:10px;background:#eef4ff;color:#234a9f;margin:10px 0}.toast{position:fixed;right:16px;bottom:16px;background:#111;color:#fff;padding:12px 15px;border-radius:10px;z-index:99}
@media(max-width:900px){.auth{grid-template-columns:1fr}.hero{display:none}.shell{grid-template-columns:1fr}.side{height:auto;position:static}.nav{grid-template-columns:repeat(3,1fr)}.g4,.g2{grid-template-columns:1fr 1fr}.content{padding:16px}}@media(max-width:560px){.g4,.g2{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.item{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div id="app"></div>
<script>
const SUPABASE_URL='https://gugjzwdgmledwrgxznhb.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_HzSzqcnQ35Fw8ShOSEcsFg_3YHu-8DP';
const STORE='dinamize7os_session';
const inviteMatch=location.pathname.match(/^\/convite\/([^/]+)$/);
const inviteToken=inviteMatch?decodeURIComponent(inviteMatch[1]):null;
const state={session:null,user:null,profile:null,agencyMember:null,clientMember:null,agency:null,client:null,tab:'dashboard'};
const app=document.getElementById('app');
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
function saveSession(v){state.session=v;if(v)localStorage.setItem(STORE,JSON.stringify(v));else localStorage.removeItem(STORE)}
async function api(path,opt={}){const h={apikey:SUPABASE_PUBLISHABLE_KEY};if(opt.auth!==false&&state.session?.access_token)h.Authorization='Bearer '+state.session.access_token;if(opt.body!==undefined)h['Content-Type']='application/json';const r=await fetch(SUPABASE_URL+path,{method:opt.method||'GET',headers:h,body:opt.body===undefined?undefined:JSON.stringify(opt.body)});const tx=await r.text();let d=null;try{d=tx?JSON.parse(tx):null}catch{d=tx}if(!r.ok)throw Error((d&&(d.message||d.error_description||d.error))||('Erro '+r.status));return d}
const db={list:(t,q)=>api('/rest/v1/'+t+'?'+q),insert:(t,d)=>api('/rest/v1/'+t,{method:'POST',body:d}),update:(t,f,d)=>api('/rest/v1/'+t+'?'+f,{method:'PATCH',body:d}),remove:(t,f)=>api('/rest/v1/'+t+'?'+f,{method:'DELETE'})};

function inviteLinkModal(title,url,description){
  const w=document.createElement('div');
  w.className='modalbg';
  w.innerHTML='<div class="modal"><div class="mh"><b>'+esc(title)+'</b><button class="btn ghost x">×</button></div><div class="mb"><div class="notice">'+esc(description)+'</div><div class="field"><label>Link personalizado</label><div class="copybox"><input id="invite-url" value="'+esc(url)+'" readonly><button class="btn blue" id="copy-invite">Copiar link</button></div></div></div><div class="mf"><button class="btn ghost x">Fechar</button></div></div>';
  document.body.appendChild(w);
  w.querySelectorAll('.x').forEach(x=>x.onclick=()=>w.remove());
  w.querySelector('#copy-invite').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('Link copiado.')}catch{const i=w.querySelector('#invite-url');i.select();document.execCommand('copy');toast('Link copiado.')}};
}

async function createInviteModal(opts){
  const isClient=opts.invite_type==='client';
  const fields=
    '<div class="notice">A pessoa abrirá o convite, aceitará, enviará o e-mail para aprovação e só depois você libera o acesso.</div>'+
    '<div class="field"><label>Nome da pessoa (opcional)</label><input name="full_name" value="'+esc(opts.full_name||'')+'"></div>'+
    '<div class="field"><label>Restringir a um e-mail (opcional)</label><input name="restricted_email" type="email" value="'+esc(opts.email||'')+'" placeholder="Deixe vazio para qualquer e-mail"></div>'+
    '<div class="field"><label>Perfil de acesso</label><select name="role">'+
      (isClient
        ? '<option value="client_admin">Administrador do cliente</option><option value="client_approver" selected>Aprovador</option><option value="client_viewer">Somente visualização</option>'
        : '<option value="member" selected>Membro</option><option value="manager">Gerente</option><option value="admin">Administrador</option>'+(state.agencyMember?.role==='owner'?'<option value="owner">Co-proprietário</option>':'')
      )+
    '</select></div>'+
    '<div class="field"><label>Validade</label><select name="expires_days"><option value="1">1 dia</option><option value="7" selected>7 dias</option><option value="30">30 dias</option></select></div>';
  formModal(isClient?'Criar convite do cliente':'Criar convite da equipe',fields,async d=>{
    const out=await api('/functions/v1/create-invite',{method:'POST',body:{
      agency_id:state.agencyMember.agency_id,
      client_id:isClient?opts.client_id:null,
      invite_type:opts.invite_type,
      role:d.role,
      restricted_email:d.restricted_email||null,
      full_name:d.full_name||null,
      expires_days:Number(d.expires_days||7)
    }});
    setTimeout(()=>inviteLinkModal('Convite criado',out.invite_url,'Envie este link para a pessoa. Depois que ela aceitar e informar o e-mail, a solicitação aparecerá na sua Caixa de entrada.'),50);
  });
}

async function inviteLanding(token){
  app.innerHTML='<div class="invitewrap"><div class="card invitecard"><div class="brand"><span class="mark">7</span>Dinamize7OS</div><p class="mut" style="margin-top:22px">Carregando convite...</p></div></div>';
  try{
    const info=await api('/functions/v1/invite-info',{method:'POST',body:{token},auth:false});
    const company=info.invite_type==='client'?(info.client_name||info.agency_name):info.agency_name;
    const message=info.invite_type==='client'
      ? 'Você foi convidado para participar do sistema de gerenciamento da '+company+'.'
      : 'Você foi convidado para participar da equipe da '+company+'.';

    app.innerHTML='<div class="invitewrap"><div class="card invitecard"><div class="brand"><span class="mark">7</span>Dinamize7OS</div><div class="eyebrow" style="margin-top:24px">Convite especial</div><h1>Parabéns, você foi convidado.</h1><p class="mut" style="font-size:16px;line-height:1.55">'+esc(message)+'</p><div id="invite-choice" class="actions" style="margin-top:22px"><button class="btn blue" id="accept-choice">Aceitar convite</button><button class="btn ghost" id="decline-choice">Recusar</button></div><div id="invite-form-wrap" style="display:none;margin-top:18px"><div class="notice">Informe seus dados. O acesso só será liberado depois que um administrador aprovar sua solicitação.</div><form id="request-access"><div class="field"><label>Seu nome</label><input name="full_name" value="'+esc(info.full_name||'')+'" required></div><div class="field"><label>Seu e-mail</label><input name="email" type="email" value="'+esc(info.restricted_email||'')+'" '+(info.restricted_email?'readonly':'')+' required></div><button class="btn blue" style="width:100%">Enviar solicitação</button></form></div></div></div>';

    document.getElementById('accept-choice').onclick=()=>{
      document.getElementById('invite-choice').style.display='none';
      document.getElementById('invite-form-wrap').style.display='block';
    };

    document.getElementById('decline-choice').onclick=()=>{
      app.innerHTML='<div class="invitewrap"><div class="card invitecard"><div class="brand"><span class="mark">7</span>Dinamize7OS</div><h1>Convite recusado</h1><p class="mut">Nenhum acesso foi criado.</p></div></div>';
    };

    document.getElementById('request-access').onsubmit=async ev=>{
      ev.preventDefault();
      const form=new FormData(ev.target);
      const btn=ev.target.querySelector('button');
      btn.disabled=true;
      btn.textContent='Enviando...';
      try{
        const out=await api('/functions/v1/request-invite-access',{
          method:'POST',
          body:{token,email:form.get('email'),full_name:form.get('full_name')},
          auth:false
        });
        app.innerHTML='<div class="invitewrap"><div class="card invitecard"><div class="brand"><span class="mark">7</span>Dinamize7OS</div><div class="eyebrow" style="margin-top:24px">Solicitação enviada</div><h1>Agora é só aguardar a aprovação.</h1><p class="mut" style="font-size:16px;line-height:1.55">Seu e-mail foi enviado para a equipe responsável. Depois da aprovação, você receberá os dados necessários para entrar no sistema.</p></div></div>';
      }catch(err){
        toast(err.message);
        btn.disabled=false;
        btn.textContent='Enviar solicitação';
      }
    };
  }catch(err){
    app.innerHTML='<div class="invitewrap"><div class="card invitecard"><div class="brand"><span class="mark">7</span>Dinamize7OS</div><h1>Convite indisponível</h1><p class="mut">'+esc(err.message)+'</p><a class="btn blue" style="display:inline-block;text-decoration:none;margin-top:12px" href="/">Ir para o login</a></div></div>';
  }
}

async function loadIdentity(){state.user=await api('/auth/v1/user');const id=state.user.id;const [p,a,c]=await Promise.all([db.list('profiles','select=*&user_id=eq.'+id+'&limit=1'),db.list('agency_members','select=*&user_id=eq.'+id+'&status=eq.active&limit=1'),db.list('client_members','select=*&user_id=eq.'+id+'&status=eq.active&limit=1')]);state.profile=p[0]||{full_name:state.user.email};state.agencyMember=a[0]||null;state.clientMember=c[0]||null;const aid=state.agencyMember?.agency_id||state.clientMember?.agency_id;if(aid)state.agency=(await db.list('agencies','select=*&id=eq.'+aid+'&limit=1'))[0];if(state.clientMember)state.client=(await db.list('clients','select=*&id=eq.'+state.clientMember.client_id+'&limit=1'))[0]}
function authView(){app.innerHTML='<div class="auth"><section class="hero"><div class="brand"><span class="mark">7</span>Dinamize7OS</div><div><h1>Sua agência inteira em um só sistema.</h1><p>Clientes, cronogramas, reuniões e aprovações em um SaaS white-label separado do Dinamize OS original.</p></div><p>Supabase isolado • RLS multiagência • portal do cliente</p></section><section class="authside"><div class="card login"><h2>Entrar</h2><p class="mut">Agência e clientes usam o mesmo acesso.</p><form id="login"><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Senha</label><input name="password" type="password" required></div><button class="btn blue" style="width:100%">Entrar no Dinamize7OS</button></form><button class="link" id="first">Criar primeiro administrador</button></div></section></div>';
document.getElementById('login').onsubmit=async(ev)=>{ev.preventDefault();const f=new FormData(ev.target);try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email:f.get('email'),password:f.get('password')},auth:false});saveSession(d);await loadIdentity();render()}catch(err){toast(err.message)}};
document.getElementById('first').onclick=()=>formModal('Primeiro administrador','<div class="notice">Use somente para configurar o primeiro proprietário.</div><div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Senha</label><input name="password" type="password" minlength="8" required></div>',async d=>{const r=await api('/auth/v1/signup',{method:'POST',body:{email:d.email,password:d.password,data:{full_name:d.name}},auth:false});if(r.access_token){saveSession(r);await loadIdentity();render()}else toast('Conta criada. Confirme o e-mail e faça login.')})}
function setup(){app.innerHTML='<div class="authside" style="min-height:100vh"><div class="card login"><div class="brand"><span class="mark">7</span>Dinamize7OS</div><h2>Configuração inicial</h2><p class="mut">Sua conta ainda não pertence à agência.</p><div class="notice">Se você é o primeiro administrador, assuma a propriedade agora. Isso só funciona uma vez.</div><button class="btn blue" id="claim" style="width:100%">Assumir como proprietário</button></div></div>';document.getElementById('claim').onclick=async()=>{try{await api('/functions/v1/claim-owner',{method:'POST',body:{full_name:state.profile.full_name}});await loadIdentity();render()}catch(err){toast(err.message)}}}
const nav=()=>state.agencyMember?[['dashboard','Visão geral'],['clients','Clientes'],['agenda','Agenda'],['content','Cronograma'],['inbox','Caixa de entrada'],['team','Equipe']]:[['home','Início'],['approvals','Aprovações'],['calendar','Cronograma']];
function shell(body){const n=nav();app.innerHTML='<div class="shell"><aside class="side"><div class="brand"><span class="mark">7</span>Dinamize7OS</div><nav class="nav">'+n.map(x=>'<button data-tab="'+x[0]+'" class="'+(state.tab===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</nav><div class="spacer"></div><div class="user"><strong>'+esc(state.profile.full_name||state.user.email)+'</strong>'+(state.agencyMember?'Agência':'Cliente')+'<br><button class="link" id="logout" style="color:#8eb7ff">Sair</button></div></aside><main class="main"><header class="top"><strong>'+(state.client?esc(state.client.name):'Dinamize7OS')+'</strong><span class="badge">'+(state.agencyMember?'Agência':'Cliente')+'</span></header><div class="content">'+body+'</div></main></div>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.getElementById('logout').onclick=logout}
async function logout(){try{await api('/auth/v1/logout',{method:'POST'})}catch{}saveSession(null);Object.assign(state,{user:null,agencyMember:null,clientMember:null});render()}
const head=(t,s,b='')=>'<div class="head"><div><h2>'+t+'</h2><p>'+s+'</p></div>'+b+'</div>';
const stat=(l,v)=>'<div class="card stat"><span>'+l+'</span><b>'+v+'</b></div>';
function badge(s){const m={active:['Ativo','ok'],archived:['Arquivado',''],pending:['Pendente','wait'],approved:['Aprovado','ok'],rejected:['Recusado','bad'],awaiting_client:['Aguardando cliente','wait'],changes_requested:['Alteração solicitada','bad'],not_requested:['Não enviado',''],scheduled:['Agendado','ok']},x=m[s]||[s,''];return '<span class="badge '+x[1]+'">'+esc(x[0])+'</span>'}
async function dashboard(){const aid=state.agencyMember.agency_id;const [clients,events,items]=await Promise.all([db.list('clients','select=id&agency_id=eq.'+aid),db.list('calendar_events','select=id&agency_id=eq.'+aid),db.list('content_schedule_items','select=approval_status&agency_id=eq.'+aid)]);shell(head('Visão geral','Operação da agência em tempo real.')+'<div class="grid g4">'+stat('Clientes',clients.length)+stat('Compromissos',events.length)+stat('Aguardando',items.filter(x=>x.approval_status==='awaiting_client').length)+stat('Aprovados',items.filter(x=>x.approval_status==='approved').length)+'</div>')}
async function clients(){const aid=state.agencyMember.agency_id,r=await db.list('clients','select=*&agency_id=eq.'+aid+'&order=name.asc');shell(head('Clientes','Empresas atendidas pela agência.','<button class="btn blue" id="add">+ Novo cliente</button>')+'<div class="card"><div class="tbl"><table><thead><tr><th>Cliente</th><th>E-mail</th><th>Telefone</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+(r.length?r.map(c=>'<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.email||'—')+'</td><td>'+esc(c.phone||'—')+'</td><td>'+badge(c.status)+'</td><td><div class="actions"><button class="btn blue invite-client" data-id="'+c.id+'">Criar convite</button><button class="btn soft edit-client" data-id="'+c.id+'">Editar</button><button class="btn ghost archive-client" data-id="'+c.id+'">'+(c.status==='archived'?'Ativar':'Arquivar')+'</button><button class="btn ghost delete-client" data-id="'+c.id+'">Excluir</button></div></td></tr>').join(''):'<tr><td colspan="5" class="empty">Nenhum cliente</td></tr>')+'</tbody></table></div></div>');

document.getElementById('add').onclick=()=>formModal('Novo cliente','<div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>E-mail</label><input name="email" type="email"></div><div class="field"><label>Telefone</label><input name="phone"></div>',async d=>{await db.insert('clients',{agency_id:aid,name:d.name,email:d.email||null,phone:d.phone||null,status:'active',created_by:state.user.id});clients()});

document.querySelectorAll('.invite-client').forEach(b=>b.onclick=()=>{const c=r.find(x=>x.id===b.dataset.id);createInviteModal({invite_type:'client',client_id:c.id,email:c.email||'',full_name:''})});
document.querySelectorAll('.edit-client').forEach(b=>b.onclick=()=>{const c=r.find(x=>x.id===b.dataset.id);formModal('Editar cliente','<div class="field"><label>Nome</label><input name="name" value="'+esc(c.name)+'" required></div><div class="field"><label>E-mail</label><input name="email" type="email" value="'+esc(c.email||'')+'"></div><div class="field"><label>Telefone</label><input name="phone" value="'+esc(c.phone||'')+'"></div>',async d=>{await db.update('clients','id=eq.'+c.id,{name:d.name,email:d.email||null,phone:d.phone||null});toast('Cliente atualizado.');clients()})});
document.querySelectorAll('.archive-client').forEach(b=>b.onclick=async()=>{const c=r.find(x=>x.id===b.dataset.id);await db.update('clients','id=eq.'+c.id,{status:c.status==='archived'?'active':'archived'});clients()});
document.querySelectorAll('.delete-client').forEach(b=>b.onclick=async()=>{const c=r.find(x=>x.id===b.dataset.id);if(!confirm('Excluir o cliente "'+c.name+'"? Esta ação pode falhar se houver dados vinculados.'))return;try{await db.remove('clients','id=eq.'+c.id);toast('Cliente excluído.');clients()}catch(err){toast(err.message)}})
}
async function agenda(){const aid=state.agencyMember.agency_id,r=await db.list('calendar_events','select=*&agency_id=eq.'+aid+'&order=starts_at.asc');shell(head('Agenda','Reuniões, prazos e compromissos.','<button class="btn blue" id="add">+ Criar evento</button>')+'<div class="card"><div class="tbl"><table><thead><tr><th>Data</th><th>Título</th><th>Tipo</th><th>Ações</th></tr></thead><tbody>'+(r.length?r.map(x=>'<tr><td>'+new Date(x.starts_at).toLocaleString('pt-BR')+'</td><td><b>'+esc(x.title)+'</b></td><td>'+esc(x.event_type)+'</td><td><div class="actions"><button class="btn soft edit-event" data-id="'+x.id+'">Editar</button><button class="btn ghost delete-event" data-id="'+x.id+'">Excluir</button></div></td></tr>').join(''):'<tr><td colspan="4" class="empty">Agenda vazia</td></tr>')+'</tbody></table></div></div>');

document.getElementById('add').onclick=async()=>{const cs=await db.list('clients','select=id,name&agency_id=eq.'+aid+'&order=name.asc');formModal('Novo evento','<div class="field"><label>Título</label><input name="title" required></div><div class="field"><label>Cliente</label><select name="client_id"><option value="">Interno</option>'+cs.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label>Tipo</label><select name="event_type"><option value="meeting">Reunião</option><option value="deadline">Prazo</option><option value="publication">Publicação</option></select></div><div class="field"><label>Data e hora</label><input name="starts_at" type="datetime-local" required></div>',async d=>{await db.insert('calendar_events',{agency_id:aid,client_id:d.client_id||null,title:d.title,event_type:d.event_type,starts_at:d.starts_at,status:'scheduled',created_by:state.user.id});agenda()})};

document.querySelectorAll('.edit-event').forEach(b=>b.onclick=async()=>{const x=r.find(v=>v.id===b.dataset.id),cs=await db.list('clients','select=id,name&agency_id=eq.'+aid+'&order=name.asc');const dt=x.starts_at?new Date(new Date(x.starts_at).getTime()-new Date(x.starts_at).getTimezoneOffset()*60000).toISOString().slice(0,16):'';formModal('Editar evento','<div class="field"><label>Título</label><input name="title" value="'+esc(x.title)+'" required></div><div class="field"><label>Cliente</label><select name="client_id"><option value="">Interno</option>'+cs.map(c=>'<option value="'+c.id+'" '+(c.id===x.client_id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label>Tipo</label><select name="event_type"><option value="meeting" '+(x.event_type==='meeting'?'selected':'')+'>Reunião</option><option value="deadline" '+(x.event_type==='deadline'?'selected':'')+'>Prazo</option><option value="publication" '+(x.event_type==='publication'?'selected':'')+'>Publicação</option></select></div><div class="field"><label>Data e hora</label><input name="starts_at" type="datetime-local" value="'+dt+'" required></div>',async d=>{await db.update('calendar_events','id=eq.'+x.id,{title:d.title,client_id:d.client_id||null,event_type:d.event_type,starts_at:d.starts_at});toast('Evento atualizado.');agenda()})});
document.querySelectorAll('.delete-event').forEach(b=>b.onclick=async()=>{const x=r.find(v=>v.id===b.dataset.id);if(!confirm('Excluir o evento "'+x.title+'"?'))return;await db.remove('calendar_events','id=eq.'+x.id);toast('Evento excluído.');agenda()})

async function content(){const aid=state.agencyMember.agency_id,[items,cs]=await Promise.all([db.list('content_schedule_items','select=*&agency_id=eq.'+aid+'&order=scheduled_at.asc'),db.list('clients','select=id,name&agency_id=eq.'+aid+'&order=name.asc')]);const names=Object.fromEntries(cs.map(c=>[c.id,c.name]));shell(head('Cronograma','Planejamento com aprovação do cliente.','<button class="btn blue" id="add">+ Novo conteúdo</button>')+'<div class="items">'+(items.length?items.map(x=>'<div class="card item"><div><h3>'+esc(x.title)+'</h3><div class="mut">'+esc(names[x.client_id]||'')+' · '+(x.scheduled_at?new Date(x.scheduled_at).toLocaleString('pt-BR'):'Sem data')+'</div><div style="margin-top:8px">'+badge(x.approval_status)+'</div></div><div class="actions"><button class="btn soft edit-content" data-id="'+x.id+'">Editar</button>'+((x.approval_status==='not_requested'||x.approval_status==='changes_requested')?'<button class="btn soft send" data-id="'+x.id+'">Enviar aprovação</button>':'')+'<button class="btn ghost delete-content" data-id="'+x.id+'">Excluir</button></div></div>').join(''):'<div class="card empty">Cronograma vazio</div>')+'</div>');

document.querySelectorAll('.send').forEach(b=>b.onclick=async()=>{await db.update('content_schedule_items','id=eq.'+b.dataset.id,{status:'awaiting_client',approval_status:'awaiting_client',approval_requested_at:new Date().toISOString()});content()});
document.getElementById('add').onclick=()=>{if(!cs.length)return toast('Cadastre um cliente primeiro.');formModal('Novo conteúdo','<div class="field"><label>Título</label><input name="title" required></div><div class="field"><label>Cliente</label><select name="client_id" required>'+cs.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label>Data</label><input name="scheduled_at" type="datetime-local" required></div><div class="field"><label>Legenda / briefing</label><textarea name="caption"></textarea></div>',async d=>{let sc=await db.list('content_schedules','select=*&agency_id=eq.'+aid+'&client_id=eq.'+d.client_id+'&status=eq.active&limit=1');if(!sc[0]){await db.insert('content_schedules',{agency_id:aid,client_id:d.client_id,name:'Cronograma',status:'active',created_by:state.user.id});sc=await db.list('content_schedules','select=*&agency_id=eq.'+aid+'&client_id=eq.'+d.client_id+'&status=eq.active&limit=1')}await db.insert('content_schedule_items',{agency_id:aid,schedule_id:sc[0].id,client_id:d.client_id,title:d.title,scheduled_at:d.scheduled_at,caption:d.caption||null,status:'draft',approval_status:'not_requested',created_by:state.user.id});content()})};

document.querySelectorAll('.edit-content').forEach(b=>b.onclick=()=>{const x=items.find(v=>v.id===b.dataset.id);const dt=x.scheduled_at?new Date(new Date(x.scheduled_at).getTime()-new Date(x.scheduled_at).getTimezoneOffset()*60000).toISOString().slice(0,16):'';formModal('Editar conteúdo','<div class="field"><label>Título</label><input name="title" value="'+esc(x.title)+'" required></div><div class="field"><label>Cliente</label><select name="client_id" required>'+cs.map(c=>'<option value="'+c.id+'" '+(c.id===x.client_id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label>Data</label><input name="scheduled_at" type="datetime-local" value="'+dt+'" required></div><div class="field"><label>Legenda / briefing</label><textarea name="caption">'+esc(x.caption||'')+'</textarea></div>',async d=>{await db.update('content_schedule_items','id=eq.'+x.id,{title:d.title,client_id:d.client_id,scheduled_at:d.scheduled_at,caption:d.caption||null});toast('Conteúdo atualizado.');content()})});
document.querySelectorAll('.delete-content').forEach(b=>b.onclick=async()=>{const x=items.find(v=>v.id===b.dataset.id);if(!confirm('Excluir o conteúdo "'+x.title+'"?'))return;try{await db.remove('content_schedule_items','id=eq.'+x.id);toast('Conteúdo excluído.');content()}catch(err){toast(err.message)}})
}
async function inbox(){
  const aid=state.agencyMember.agency_id;
  const [requests,clientsList]=await Promise.all([
    db.list('workspace_access_requests','select=*&agency_id=eq.'+aid+'&order=requested_at.desc'),
    db.list('clients','select=id,name&agency_id=eq.'+aid)
  ]);
  const clientNames=Object.fromEntries(clientsList.map(c=>[c.id,c.name]));
  shell(
    head('Caixa de entrada','Solicitações de acesso enviadas pelos convites.')+
    '<div class="items">'+(
      requests.length
      ? requests.map(r=>'<div class="card item"><div><h3>'+esc(r.full_name||r.email)+'</h3><div class="mut">'+esc(r.email)+' · '+(r.invite_type==='client'?('Cliente: '+esc(clientNames[r.client_id]||'—')):'Equipe')+'</div><div style="margin-top:8px">'+badge(r.status)+'</div></div><div class="actions">'+(r.status==='pending'?'<button class="btn blue approve-access" data-id="'+r.id+'">Aprovar</button><button class="btn ghost reject-access" data-id="'+r.id+'">Recusar</button>':'')+'</div></div>').join('')
      : '<div class="card empty">Nenhuma solicitação de acesso.</div>'
    )+'</div>'
  );

  document.querySelectorAll('.approve-access').forEach(b=>b.onclick=async()=>{
    try{
      const out=await api('/functions/v1/review-access-request',{method:'POST',body:{request_id:b.dataset.id,decision:'approve'}});
      if(out.existing_user){
        inviteLinkModal('Acesso aprovado','', 'Esse e-mail já tinha uma conta no Dinamize7OS. O acesso foi liberado e a pessoa deve entrar com a senha que já usa.');
        const input=document.querySelector('.copybox'); if(input) input.remove();
      }else{
        const w=document.createElement('div');
        w.className='modalbg';
        w.innerHTML='<div class="modal"><div class="mh"><b>Acesso aprovado</b><button class="btn ghost x">×</button></div><div class="mb"><div class="notice">A conta foi criada. Esta senha temporária é exibida somente agora e não fica salva no sistema.</div><div class="field"><label>E-mail</label><input value="'+esc(out.email)+'" readonly></div><div class="field"><label>Senha temporária</label><div class="copybox"><input id="temp-pass" value="'+esc(out.temporary_password)+'" readonly><button class="btn blue" id="copy-pass">Copiar</button></div></div><p class="mut" style="font-size:12px">Envie a senha para a pessoa por um canal seguro. Depois ela poderá alterar ou recuperar a senha.</p></div><div class="mf"><button class="btn ghost x">Fechar</button></div></div>';
        document.body.appendChild(w);
        w.querySelectorAll('.x').forEach(x=>x.onclick=()=>w.remove());
        w.querySelector('#copy-pass').onclick=async()=>{try{await navigator.clipboard.writeText(out.temporary_password);toast('Senha copiada.')}catch{const i=w.querySelector('#temp-pass');i.select();document.execCommand('copy');toast('Senha copiada.')}};
      }
      inbox();
    }catch(err){toast(err.message)}
  });

  document.querySelectorAll('.reject-access').forEach(b=>b.onclick=async()=>{
    if(!confirm('Recusar esta solicitação de acesso?')) return;
    try{
      await api('/functions/v1/review-access-request',{method:'POST',body:{request_id:b.dataset.id,decision:'reject'}});
      toast('Solicitação recusada.');
      inbox();
    }catch(err){toast(err.message)}
  });
}

async function team(){const aid=state.agencyMember.agency_id,[am,cm,cs]=await Promise.all([db.list('agency_members','select=*&agency_id=eq.'+aid),db.list('client_members','select=*&agency_id=eq.'+aid),db.list('clients','select=id,name&agency_id=eq.'+aid)]);shell(head('Equipe e acessos','Crie e gerencie logins da equipe e dos clientes.','<div class="actions"><button class="btn ghost" id="invite-team">Criar link de convite</button><button class="btn blue" id="add">+ Criar acesso</button></div>')+'<div class="grid g2"><div class="card"><h3>Equipe</h3>'+(am.length?am.map(x=>'<div class="item"><p>'+esc(x.role)+' '+badge(x.status)+'</p><div class="actions"><button class="btn soft edit-member" data-id="'+x.id+'">Editar</button>'+(x.user_id!==state.user.id?'<button class="btn ghost remove-member" data-id="'+x.id+'">Remover</button>':'')+'</div></div>').join(''):'<p class="mut">Nenhum membro.</p>')+'</div><div class="card"><h3>Clientes com acesso</h3>'+(cm.length?cm.map(x=>'<div class="item"><p>'+esc(cs.find(c=>c.id===x.client_id)?.name||'Cliente')+' · '+esc(x.role)+'</p><div class="actions"><button class="btn soft edit-client-member" data-id="'+x.id+'">Editar</button><button class="btn ghost remove-client-member" data-id="'+x.id+'">Remover</button></div></div>').join(''):'<p class="mut">Nenhum acesso criado.</p>')+'</div></div>');

document.getElementById('invite-team').onclick=()=>createInviteModal({invite_type:'agency'});
document.getElementById('add').onclick=()=>formModal('Criar acesso','<div class="field"><label>Tipo</label><select name="account_type"><option value="agency">Equipe</option><option value="client">Cliente</option></select></div><div class="field"><label>Nome</label><input name="full_name" required></div><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Senha inicial</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>Perfil</label><select name="role"><option value="member">Equipe</option><option value="admin">Administrador</option><option value="manager">Gerente</option><option value="client_approver">Aprovador do cliente</option><option value="client_viewer">Cliente visualização</option></select></div><div class="field"><label>Cliente (se acesso de cliente)</label><select name="client_id"><option value="">Selecione</option>'+cs.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div>',async d=>{await api('/functions/v1/create-user',{method:'POST',body:{agency_id:aid,...d,client_id:d.client_id||null}});team()});

document.querySelectorAll('.edit-member').forEach(b=>b.onclick=()=>{const x=am.find(v=>v.id===b.dataset.id);formModal('Editar acesso da equipe','<div class="field"><label>Função</label><select name="role"><option value="owner" '+(x.role==='owner'?'selected':'')+'>Dono</option><option value="admin" '+(x.role==='admin'?'selected':'')+'>Administrador</option><option value="manager" '+(x.role==='manager'?'selected':'')+'>Gerente</option><option value="member" '+(x.role==='member'?'selected':'')+'>Membro</option></select></div><div class="field"><label>Status</label><select name="status"><option value="active" '+(x.status==='active'?'selected':'')+'>Ativo</option><option value="disabled" '+(x.status==='disabled'?'selected':'')+'>Desativado</option></select></div>',async d=>{await db.update('agency_members','id=eq.'+x.id,{role:d.role,status:d.status});toast('Acesso atualizado.');team()})});
document.querySelectorAll('.remove-member').forEach(b=>b.onclick=async()=>{if(!confirm('Remover esta pessoa da empresa?'))return;await db.remove('agency_members','id=eq.'+b.dataset.id);toast('Membro removido.');team()});
document.querySelectorAll('.edit-client-member').forEach(b=>b.onclick=()=>{const x=cm.find(v=>v.id===b.dataset.id);formModal('Editar acesso do cliente','<div class="field"><label>Perfil</label><select name="role"><option value="client_admin" '+(x.role==='client_admin'?'selected':'')+'>Administrador do cliente</option><option value="client_approver" '+(x.role==='client_approver'?'selected':'')+'>Aprovador</option><option value="client_viewer" '+(x.role==='client_viewer'?'selected':'')+'>Visualização</option></select></div><div class="field"><label>Status</label><select name="status"><option value="active" '+(x.status==='active'?'selected':'')+'>Ativo</option><option value="disabled" '+(x.status==='disabled'?'selected':'')+'>Desativado</option></select></div>',async d=>{await db.update('client_members','id=eq.'+x.id,{role:d.role,status:d.status});toast('Acesso atualizado.');team()})});
document.querySelectorAll('.remove-client-member').forEach(b=>b.onclick=async()=>{if(!confirm('Remover este acesso do cliente?'))return;await db.remove('client_members','id=eq.'+b.dataset.id);toast('Acesso removido.');team()})
}
async function clientHome(){const cid=state.clientMember.client_id,r=await db.list('content_schedule_items','select=approval_status&client_id=eq.'+cid),p=r.filter(x=>x.approval_status==='awaiting_client');shell(head('Olá, '+esc((state.profile.full_name||'cliente').split(' ')[0]),p.length?'Você tem '+p.length+' conteúdo(s) para revisar.':'Nenhuma aprovação pendente.')+'<div class="grid g2">'+stat('Aguardando',p.length)+stat('Aprovados',r.filter(x=>x.approval_status==='approved').length)+'</div>')}
async function approvals(){const cid=state.clientMember.client_id,r=await db.list('content_schedule_items','select=*&client_id=eq.'+cid+'&approval_status=neq.not_requested&order=scheduled_at.asc');shell(head('Aprovações','Revise antes da publicação.')+'<div class="items">'+(r.length?r.map(x=>'<div class="card item"><div><h3>'+esc(x.title)+'</h3><p class="mut">'+esc(x.caption||'Sem legenda')+'</p>'+badge(x.approval_status)+'</div><div class="actions">'+(x.approval_status==='awaiting_client'?'<button class="btn blue approve" data-id="'+x.id+'">Aprovar</button><button class="btn ghost changes" data-id="'+x.id+'">Pedir alteração</button>':'')+'</div></div>').join(''):'<div class="card empty">Nada para revisar</div>')+'</div>');document.querySelectorAll('.approve').forEach(b=>b.onclick=async()=>{await db.insert('content_approvals',{agency_id:state.clientMember.agency_id,content_item_id:b.dataset.id,client_id:cid,user_id:state.user.id,action:'approved',comment:'Aprovado pelo cliente'});approvals()});document.querySelectorAll('.changes').forEach(b=>b.onclick=()=>formModal('Solicitar alteração','<div class="field"><label>O que deseja alterar?</label><textarea name="comment" required></textarea></div>',async d=>{await db.insert('content_approvals',{agency_id:state.clientMember.agency_id,content_item_id:b.dataset.id,client_id:cid,user_id:state.user.id,action:'changes_requested',comment:d.comment});approvals()}))}
async function clientCalendar(){const cid=state.clientMember.client_id,r=await db.list('content_schedule_items','select=*&client_id=eq.'+cid+'&order=scheduled_at.asc');shell(head('Cronograma','Datas de conteúdo planejadas pela agência.')+'<div class="card"><div class="tbl"><table><thead><tr><th>Data</th><th>Conteúdo</th><th>Status</th></tr></thead><tbody>'+(r.length?r.map(x=>'<tr><td>'+(x.scheduled_at?new Date(x.scheduled_at).toLocaleString('pt-BR'):'—')+'</td><td><b>'+esc(x.title)+'</b></td><td>'+badge(x.approval_status)+'</td></tr>').join(''):'<tr><td colspan="3" class="empty">Cronograma vazio</td></tr>')+'</tbody></table></div></div>')}
function formModal(title,fields,cb){const w=document.createElement('div');w.className='modalbg';w.innerHTML='<div class="modal"><div class="mh"><b>'+esc(title)+'</b><button class="btn ghost x">×</button></div><form><div class="mb">'+fields+'</div><div class="mf"><button type="button" class="btn ghost x">Cancelar</button><button class="btn blue">Salvar</button></div></form></div>';document.body.appendChild(w);w.querySelectorAll('.x').forEach(x=>x.onclick=()=>w.remove());w.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));try{await cb(d);w.remove()}catch(err){toast(err.message)}}}
async function render(){if(!state.session)return authView();if(!state.user){try{await loadIdentity()}catch{saveSession(null);return authView()}}if(!state.agencyMember&&!state.clientMember)return setup();if(state.agencyMember){if(!['dashboard','clients','agenda','content','inbox','team'].includes(state.tab))state.tab='dashboard';return ({dashboard,clients,agenda,content,inbox,team})[state.tab]()}if(!['home','approvals','calendar'].includes(state.tab))state.tab='home';return ({home:clientHome,approvals,calendar:clientCalendar})[state.tab]()}
try{state.session=JSON.parse(localStorage.getItem(STORE)||'null')}catch{}
if(inviteToken)inviteLanding(inviteToken);else render();
</script>
