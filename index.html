<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dinamize7OS</title>
<meta name="description" content="Dinamize7OS — operação white-label para agências e clientes.">
<style>
:root{--b:#0066ff;--bg:#f4f6f8;--ink:#101318;--mut:#667085;--line:#e6e9ef;--card:#fff}
*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.blue{background:var(--b);color:#fff}.soft{background:#eef4ff;color:#2049a2}.ghost{background:#fff;border:1px solid var(--line)}
input,select,textarea{width:100%;border:1px solid #d9dee7;border-radius:10px;padding:11px;background:#fff;outline:none}textarea{min-height:90px}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:12px;font-weight:750;color:#475467}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}.hero{background:#0b0d11;color:#fff;padding:50px;display:flex;flex-direction:column;justify-content:space-between}.hero h1{font-size:clamp(44px,7vw,82px);line-height:.95;letter-spacing:-.06em;margin:0;max-width:720px}.hero p{color:#aab2bf;max-width:560px;line-height:1.6}
.brand{font-size:21px;font-weight:850;display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--b);color:#fff}.authside{display:grid;place-items:center;padding:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.login{width:min(430px,100%);padding:30px}.login h2{font-size:30px;letter-spacing:-.04em;margin:0 0 5px}.mut{color:var(--mut)}.link{background:none;border:0;color:var(--b);font-weight:750;cursor:pointer;padding:8px 0}
.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#0c0e12;color:#fff;padding:20px 14px;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}.side .brand{padding:3px 8px 22px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#aeb6c2;text-align:left;padding:11px;border-radius:10px;font-weight:650;cursor:pointer}.nav button.on,.nav button:hover{background:#191d24;color:#fff}.spacer{flex:1}.user{border-top:1px solid #252a32;padding:14px 8px 0;color:#aeb6c2;font-size:12px}.user strong{display:block;color:#fff;margin-bottom:4px}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.content{padding:24px;max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:20px}.head h2{margin:0;font-size:29px;letter-spacing:-.04em}.head p{margin:5px 0 0;color:var(--mut)}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.stat b{display:block;font-size:34px;margin-top:8px;letter-spacing:-.05em}.stat span{font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:800}.tbl{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:12px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}th{background:#fafbfc;color:#7b8492;font-size:10px;text-transform:uppercase}.badge{display:inline-block;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800;background:#f2f4f7;color:#667085}.ok{background:#ecfdf3;color:#027a48}.wait{background:#fffaeb;color:#a15c00}.bad{background:#fef3f2;color:#b42318}
.items{display:grid;gap:12px}.item{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.item h3{margin:0 0 5px}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;color:var(--mut);padding:35px}.modalbg{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:20}.modal{background:#fff;border-radius:18px;width:min(600px,100%);max-height:90vh;overflow:auto}.mh,.mf{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.mf{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}.mb{padding:20px}.notice{padding:11px;border-radius:10px;background:#eef4ff;color:#234a9f;margin:10px 0}.toast{position:fixed;right:16px;bottom:16px;background:#111;color:#fff;padding:12px 15px;border-radius:10px;z-index:99}
@media(max-width:900px){.auth{grid-template-columns:1fr}.hero{display:none}.shell{grid-template-columns:1fr}.side{height:auto;position:static}.nav{grid-template-columns:repeat(3,1fr)}.g4,.g2{grid-template-columns:1fr 1fr}.content{padding:16px}}@media(max-width:560px){.g4,.g2{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.item{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div id="app"></div>
<script>
const SUPABASE_URL='https://gugjzwdgmledwrgxznhb.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_HzSzqcnQ35Fw8ShOSEcsFg_3YHu-8DP';
const STORE='dinamize7os_session';
const state={session:null,user:null,profile:null,agencyMember:null,clientMember:null,agency:null,client:null,tab:'dashboard'};
const app=document.getElementById('app');
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
function saveSession(v){state.session=v;if(v)localStorage.setItem(STORE,JSON.stringify(v));else localStorage.removeItem(STORE)}
async function api(path,opt={}){const h={apikey:SUPABASE_PUBLISHABLE_KEY};if(opt.auth!==false&&state.session?.access_token)h.Authorization='Bearer '+state.session.access_token;if(opt.body!==undefined)h['Content-Type']='application/json';const r=await fetch(SUPABASE_URL+path,{method:opt.method||'GET',headers:h,body:opt.body===undefined?undefined:JSON.stringify(opt.body)});const tx=await r.text();let d=null;try{d=tx?JSON.parse(tx):null}catch{d=tx}if(!r.ok)throw Error((d&&(d.message||d.error_description||d.error))||('Erro '+r.status));return d}
const db={list:(t,q)=>api('/rest/v1/'+t+'?'+q),insert:(t,d)=>api('/rest/v1/'+t,{method:'POST',body:d}),update:(t,f,d)=>api('/rest/v1/'+t+'?'+f,{method:'PATCH',body:d})};
async function loadIdentity(){state.user=await api('/auth/v1/user');const id=state.user.id;const [p,a,c]=await Promise.all([db.list('profiles','select=*&user_id=eq.'+id+'&limit=1'),db.list('agency_members','select=*&user_id=eq.'+id+'&status=eq.active&limit=1'),db.list('client_members','select=*&user_id=eq.'+id+'&status=eq.active&limit=1')]);state.profile=p[0]||{full_name:state.user.email};state.agencyMember=a[0]||null;state.clientMember=c[0]||null;const aid=state.agencyMember?.agency_id||state.clientMember?.agency_id;if(aid)state.agency=(await db.list('agencies','select=*&id=eq.'+aid+'&limit=1'))[0];if(state.clientMember)state.client=(await db.list('clients','select=*&id=eq.'+state.clientMember.client_id+'&limit=1'))[0]}
function authView(){app.innerHTML='<div class="auth"><section class="hero"><div class="brand"><span class="mark">7</span>Dinamize7OS</div><div><h1>Sua agência inteira em um só sistema.</h1><p>Clientes, cronogramas, reuniões e aprovações em um SaaS white-label separado do Dinamize OS original.</p></div><p>Supabase isolado • RLS multiagência • portal do cliente</p></section><section class="authside"><div class="card login"><h2>Entrar</h2><p class="mut">Agência e clientes usam o mesmo acesso.</p><form id="login"><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Senha</label><input name="password" type="password" required></div><button class="btn blue" style="width:100%">Entrar no Dinamize7OS</button></form><button class="link" id="first">Criar primeiro administrador</button></div></section></div>';
document.getElementById('login').onsubmit=async(ev)=>{ev.preventDefault();const f=new FormData(ev.target);try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email:f.get('email'),password:f.get('password')},auth:false});saveSession(d);await loadIdentity();render()}catch(err){toast(err.message)}};
document.getElementById('first').onclick=()=>formModal('Primeiro administrador','<div class="notice">Use somente para configurar o primeiro proprietário.</div><div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Senha</label><input name="password" type="password" minlength="8" required></div>',async d=>{const r=await api('/auth/v1/signup',{method:'POST',body:{email:d.email,password:d.password,data:{full_name:d.name}},auth:false});if(r.access_token){saveSession(r);await loadIdentity();render()}else toast('Conta criada. Confirme o e-mail e faça login.')})}
function setup(){app.innerHTML='<div class="authside" style="min-height:100vh"><div class="card login"><div class="brand"><span class="mark">7</span>Dinamize7OS</div><h2>Configuração inicial</h2><p class="mut">Sua conta ainda não pertence à agência.</p><div class="notice">Se você é o primeiro administrador, assuma a propriedade agora. Isso só funciona uma vez.</div><button class="btn blue" id="claim" style="width:100%">Assumir como proprietário</button></div></div>';document.getElementById('claim').onclick=async()=>{try{await api('/functions/v1/claim-owner',{method:'POST',body:{full_name:state.profile.full_name}});await loadIdentity();render()}catch(err){toast(err.message)}}}
const nav=()=>state.agencyMember?[['dashboard','Visão geral'],['clients','Clientes'],['agenda','Agenda'],['content','Cronograma'],['team','Equipe']]:[['home','Início'],['approvals','Aprovações'],['calendar','Cronograma']];
function shell(body){const n=nav();app.innerHTML='<div class="shell"><aside class="side"><div class="brand"><span class="mark">7</span>Dinamize7OS</div><nav class="nav">'+n.map(x=>'<button data-tab="'+x[0]+'" class="'+(state.tab===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</nav><div class="spacer"></div><div class="user"><strong>'+esc(state.profile.full_name||state.user.email)+'</strong>'+(state.agencyMember?'Agência':'Cliente')+'<br><button class="link" id="logout" style="color:#8eb7ff">Sair</button></div></aside><main class="main"><header class="top"><strong>'+(state.client?esc(state.client.name):'Dinamize7OS')+'</strong><span class="badge">'+(state.agencyMember?'Agência':'Cliente')+'</span></header><div class="content">'+body+'</div></main></div>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.getElementById('logout').onclick=logout}
async function logout(){try{await api('/auth/v1/logout',{method:'POST'})}catch{}saveSession(null);Object.assign(state,{user:null,agencyMember:null,clientMember:null});render()}
const head=(t,s,b='')=>'<div class="head"><div><h2>'+t+'</h2><p>'+s+'</p></div>'+b+'</div>';
const stat=(l,v)=>'<div class="card stat"><span>'+l+'</span><b>'+v+'</b></div>';
function badge(s){const m={active:['Ativo','ok'],awaiting_client:['Aguardando cliente','wait'],approved:['Aprovado','ok'],changes_requested:['Alteração solicitada','bad'],not_requested:['Não enviado',''],scheduled:['Agendado','ok']},x=m[s]||[s,''];return '<span class="badge '+x[1]+'">'+esc(x[0])+'</span>'}
async function dashboard(){const aid=state.agencyMember.agency_id;const [clients,events,items]=await Promise.all([db.list('clients','select=id&agency_id=eq.'+aid),db.list('calendar_events','select=id&agency_id=eq.'+aid),db.list('content_schedule_items','select=approval_status&agency_id=eq.'+aid)]);shell(head('Visão geral','Operação da agência em tempo real.')+'<div class="grid g4">'+stat('Clientes',clients.length)+stat('Compromissos',events.length)+stat('Aguardando',items.filter(x=>x.approval_status==='awaiting_client').length)+stat('Aprovados',items.filter(x=>x.approval_status==='approved').length)+'</div>')}
async function clients(){const aid=state.agencyMember.agency_id,r=await db.list('clients','select=*&agency_id=eq.'+aid+'&order=name.asc');shell(head('Clientes','Empresas atendidas pela agência.','<button class="btn blue" id="add">+ Novo cliente</button>')+'<div class="card"><div class="tbl"><table><thead><tr><th>Cliente</th><th>E-mail</th><th>Telefone</th><th>Status</th></tr></thead><tbody>'+(r.length?r.map(c=>'<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.email||'—')+'</td><td>'+esc(c.phone||'—')+'</td><td>'+badge(c.status)+'</td></tr>').join(''):'<tr><td colspan="4" class="empty">Nenhum cliente</td></tr>')+'</tbody></table></div></div>');document.getElementById('add').onclick=()=>formModal('Novo cliente','<div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>E-mail</label><input name="email" type="email"></div><div class="field"><label>Telefone</label><input name="phone"></div>',async d=>{await db.insert('clients',{agency_id:aid,name:d.name,email:d.email||null,phone:d.phone||null,status:'active',created_by:state.user.id});clients()})}
async function agenda(){const aid=state.agencyMember.agency_id,r=await db.list('calendar_events','select=*&agency_id=eq.'+aid+'&order=starts_at.asc');shell(head('Agenda','Reuniões, prazos e compromissos.','<button class="btn blue" id="add">+ Criar evento</button>')+'<div class="card"><div class="tbl"><table><thead><tr><th>Data</th><th>Título</th><th>Tipo</th></tr></thead><tbody>'+(r.length?r.map(x=>'<tr><td>'+new Date(x.starts_at).toLocaleString('pt-BR')+'</td><td><b>'+esc(x.title)+'</b></td><td>'+esc(x.event_type)+'</td></tr>').join(''):'<tr><td colspan="3" class="empty">Agenda vazia</td></tr>')+'</tbody></table></div></div>');document.getElementById('add').onclick=async()=>{const cs=await db.list('clients','select=id,name&agency_id=eq.'+aid+'&order=name.asc');formModal('Novo evento','<div class="field"><label>Título</label><input name="title" required></div><div class="field"><label>Cliente</label><select name="client_id"><option value="">Interno</option>'+cs.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label>Tipo</label><select name="event_type"><option value="meeting">Reunião</option><option value="deadline">Prazo</option><option value="publication">Publicação</option></select></div><div class="field"><label>Data e hora</label><input name="starts_at" type="datetime-local" required></div>',async d=>{await db.insert('calendar_events',{agency_id:aid,client_id:d.client_id||null,title:d.title,event_type:d.event_type,starts_at:d.starts_at,status:'scheduled',created_by:state.user.id});agenda()})}}
async function content(){const aid=state.agencyMember.agency_id,[items,cs]=await Promise.all([db.list('content_schedule_items','select=*&agency_id=eq.'+aid+'&order=scheduled_at.asc'),db.list('clients','select=id,name&agency_id=eq.'+aid+'&order=name.asc')]);const names=Object.fromEntries(cs.map(c=>[c.id,c.name]));shell(head('Cronograma','Planejamento com aprovação do cliente.','<button class="btn blue" id="add">+ Novo conteúdo</button>')+'<div class="items">'+(items.length?items.map(x=>'<div class="card item"><div><h3>'+esc(x.title)+'</h3><div class="mut">'+esc(names[x.client_id]||'')+' · '+(x.scheduled_at?new Date(x.scheduled_at).toLocaleString('pt-BR'):'Sem data')+'</div><div style="margin-top:8px">'+badge(x.approval_status)+'</div></div><div class="actions">'+((x.approval_status==='not_requested'||x.approval_status==='changes_requested')?'<button class="btn soft send" data-id="'+x.id+'">Enviar aprovação</button>':'')+'</div></div>').join(''):'<div class="card empty">Cronograma vazio</div>')+'</div>');document.querySelectorAll('.send').forEach(b=>b.onclick=async()=>{await db.update('content_schedule_items','id=eq.'+b.dataset.id,{status:'awaiting_client',approval_status:'awaiting_client',approval_requested_at:new Date().toISOString()});content()});document.getElementById('add').onclick=()=>{if(!cs.length)return toast('Cadastre um cliente primeiro.');formModal('Novo conteúdo','<div class="field"><label>Título</label><input name="title" required></div><div class="field"><label>Cliente</label><select name="client_id" required>'+cs.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label>Data</label><input name="scheduled_at" type="datetime-local" required></div><div class="field"><label>Legenda / briefing</label><textarea name="caption"></textarea></div>',async d=>{let sc=await db.list('content_schedules','select=*&agency_id=eq.'+aid+'&client_id=eq.'+d.client_id+'&status=eq.active&limit=1');if(!sc[0]){await db.insert('content_schedules',{agency_id:aid,client_id:d.client_id,name:'Cronograma',status:'active',created_by:state.user.id});sc=await db.list('content_schedules','select=*&agency_id=eq.'+aid+'&client_id=eq.'+d.client_id+'&status=eq.active&limit=1')}await db.insert('content_schedule_items',{agency_id:aid,schedule_id:sc[0].id,client_id:d.client_id,title:d.title,scheduled_at:d.scheduled_at,caption:d.caption||null,status:'draft',approval_status:'not_requested',created_by:state.user.id});content()})}}
async function team(){const aid=state.agencyMember.agency_id,[am,cm,cs]=await Promise.all([db.list('agency_members','select=*&agency_id=eq.'+aid),db.list('client_members','select=*&agency_id=eq.'+aid),db.list('clients','select=id,name&agency_id=eq.'+aid)]);shell(head('Equipe e acessos','Crie logins para equipe e clientes.','<button class="btn blue" id="add">+ Criar acesso</button>')+'<div class="grid g2"><div class="card"><h3>Equipe</h3>'+am.map(x=>'<p>'+esc(x.role)+' '+badge(x.status)+'</p>').join('')+'</div><div class="card"><h3>Clientes com acesso</h3>'+(cm.length?cm.map(x=>'<p>'+esc(cs.find(c=>c.id===x.client_id)?.name||'Cliente')+' · '+esc(x.role)+'</p>').join(''):'<p class="mut">Nenhum acesso criado.</p>')+'</div></div>');document.getElementById('add').onclick=()=>formModal('Criar acesso','<div class="field"><label>Tipo</label><select name="account_type"><option value="agency">Equipe</option><option value="client">Cliente</option></select></div><div class="field"><label>Nome</label><input name="full_name" required></div><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Senha inicial</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>Perfil</label><select name="role"><option value="member">Equipe</option><option value="admin">Administrador</option><option value="client_approver">Aprovador do cliente</option><option value="client_viewer">Cliente visualização</option></select></div><div class="field"><label>Cliente (se acesso de cliente)</label><select name="client_id"><option value="">Selecione</option>'+cs.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div>',async d=>{await api('/functions/v1/create-user',{method:'POST',body:{agency_id:aid,...d,client_id:d.client_id||null}});team()})}
async function clientHome(){const cid=state.clientMember.client_id,r=await db.list('content_schedule_items','select=approval_status&client_id=eq.'+cid),p=r.filter(x=>x.approval_status==='awaiting_client');shell(head('Olá, '+esc((state.profile.full_name||'cliente').split(' ')[0]),p.length?'Você tem '+p.length+' conteúdo(s) para revisar.':'Nenhuma aprovação pendente.')+'<div class="grid g2">'+stat('Aguardando',p.length)+stat('Aprovados',r.filter(x=>x.approval_status==='approved').length)+'</div>')}
async function approvals(){const cid=state.clientMember.client_id,r=await db.list('content_schedule_items','select=*&client_id=eq.'+cid+'&approval_status=neq.not_requested&order=scheduled_at.asc');shell(head('Aprovações','Revise antes da publicação.')+'<div class="items">'+(r.length?r.map(x=>'<div class="card item"><div><h3>'+esc(x.title)+'</h3><p class="mut">'+esc(x.caption||'Sem legenda')+'</p>'+badge(x.approval_status)+'</div><div class="actions">'+(x.approval_status==='awaiting_client'?'<button class="btn blue approve" data-id="'+x.id+'">Aprovar</button><button class="btn ghost changes" data-id="'+x.id+'">Pedir alteração</button>':'')+'</div></div>').join(''):'<div class="card empty">Nada para revisar</div>')+'</div>');document.querySelectorAll('.approve').forEach(b=>b.onclick=async()=>{await db.insert('content_approvals',{agency_id:state.clientMember.agency_id,content_item_id:b.dataset.id,client_id:cid,user_id:state.user.id,action:'approved',comment:'Aprovado pelo cliente'});approvals()});document.querySelectorAll('.changes').forEach(b=>b.onclick=()=>formModal('Solicitar alteração','<div class="field"><label>O que deseja alterar?</label><textarea name="comment" required></textarea></div>',async d=>{await db.insert('content_approvals',{agency_id:state.clientMember.agency_id,content_item_id:b.dataset.id,client_id:cid,user_id:state.user.id,action:'changes_requested',comment:d.comment});approvals()}))}
async function clientCalendar(){const cid=state.clientMember.client_id,r=await db.list('content_schedule_items','select=*&client_id=eq.'+cid+'&order=scheduled_at.asc');shell(head('Cronograma','Datas de conteúdo planejadas pela agência.')+'<div class="card"><div class="tbl"><table><thead><tr><th>Data</th><th>Conteúdo</th><th>Status</th></tr></thead><tbody>'+(r.length?r.map(x=>'<tr><td>'+(x.scheduled_at?new Date(x.scheduled_at).toLocaleString('pt-BR'):'—')+'</td><td><b>'+esc(x.title)+'</b></td><td>'+badge(x.approval_status)+'</td></tr>').join(''):'<tr><td colspan="3" class="empty">Cronograma vazio</td></tr>')+'</tbody></table></div></div>')}
function formModal(title,fields,cb){const w=document.createElement('div');w.className='modalbg';w.innerHTML='<div class="modal"><div class="mh"><b>'+esc(title)+'</b><button class="btn ghost x">×</button></div><form><div class="mb">'+fields+'</div><div class="mf"><button type="button" class="btn ghost x">Cancelar</button><button class="btn blue">Salvar</button></div></form></div>';document.body.appendChild(w);w.querySelectorAll('.x').forEach(x=>x.onclick=()=>w.remove());w.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));try{await cb(d);w.remove()}catch(err){toast(err.message)}}}
async function render(){if(!state.session)return authView();if(!state.user){try{await loadIdentity()}catch{saveSession(null);return authView()}}if(!state.agencyMember&&!state.clientMember)return setup();if(state.agencyMember){if(!['dashboard','clients','agenda','content','team'].includes(state.tab))state.tab='dashboard';return ({dashboard,clients,agenda,content,team})[state.tab]()}if(!['home','approvals','calendar'].includes(state.tab))state.tab='home';return ({home:clientHome,approvals,calendar:clientCalendar})[state.tab]()}
try{state.session=JSON.parse(localStorage.getItem(STORE)||'null')}catch{}
render();
</script>
</body>
